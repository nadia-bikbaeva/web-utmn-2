<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Pizza</title>
    <link rel="stylesheet" href="assets/styles/style.css">
</head>

<body>
<div class="pizza-constructor">
    <div class="pizza-catalog">
        <h2>Выберите пиццу:</h2>
        <div class="pizza-grid">
            <div class="pizza-card active" data-type="Пепперони">
                <img src="assets/img/peppa.jpg" alt="Пепперони">
                <p>Пепперони</p>
            </div>
            <div class="pizza-card" data-type="Маргарита">
                <img src="assets/img/Margarita.jpg" alt="Маргарита">
                <p>Маргарита</p>
            </div>
            <div class="pizza-card" data-type="Баварская">
                <img src="assets/img/bavar.jpeg" alt="Баварская">
                <p>Баварская</p>
            </div>
        </div>
    </div>

    <div class="pizza-options">
        <div class="option-section">
            <div class="section-title">Выберите размер <span class="info-icon">ⓘ</span></div>
            <div class="size-tabs">
                <button class="size-tab active" data-size="маленькая">Маленькая</button>
                <button class="size-tab" data-size="большая">Большая</button>
            </div>
        </div>

        <div class="option-section">
            <div class="section-title">Добавить по вкусу</div>
            <div class="toppings-grid">
                <div class="topping-card" data-topping="сырный борт">
                    <img src="assets/img/cheese-crust.jpg" alt="Сырный борт">
                    <p class="name">Сырный борт</p>
                    <p class="price">от 150 ₽</p>
                </div>
                <div class="topping-card" data-topping="сливочная моцарелла">
                    <img src="assets/img/mozzarella.jpg" alt="Моцарелла">
                    <p class="name">Сливочная моцарелла</p>
                    <p class="price">50 ₽</p>
                </div>
                <div class="topping-card" data-topping="чеддер и пармезан">
                    <img src="assets/img/cheddar.jpg" alt="Чеддер">
                    <p class="name">Чеддер и пармезан</p>
                    <p class="price">от 150 ₽</p>
                </div>
            </div>
        </div>

        <button id="btn-add-to-cart" class="btn-main-order">
            Добавить в корзину за <span id="total-price">0</span> ₽ (<span id="total-calories">0</span> кКал)
        </button>
    </div>
</div>

<script type="module" src="index.js"></script>
</body>
